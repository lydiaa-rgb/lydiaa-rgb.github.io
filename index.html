ansform:rotate(-8deg);box-shadow:15px 20px 30px #332a781c}.dims{position:absolute;left:0;right:0;bottom:25px;border-top:1px solid #17231d30;padding-top:20px;display:grid;grid-template-columns:repeat(4,1fr)}.dims span{font-size:12px;font-weight:700}.dims b{color:var(--coral);font:12px Georgia;margin-right:12px}.quiz{padding:35px 0 45px;display:none!important;flex-direction:column}.quiz.active{display:flex!important}.top{display:grid;grid-template-columns:100px 1fr 70px;align-items:center;gap:24px}.leave,.back{border:0;background:none;font-size:12px;opacity:.55;cursor:pointer}.prog{height:5px;background:#17231d1a;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--violet);transition:.25s}.count{text-align:right;font:13px Georgia;opacity:.55}.qbox{text-align:center;margin:auto;width:min(930px,100%)}.qbox small{color:var(--coral);font-size:11px;letter-spacing:.12em;font-weight:700}.qbox h2{font:500 clamp(29px,4vw,48px)/1.4 Georgia,"Songti SC",serif;margin:26px auto 46px}.scale{display:flex;justify-content:center;align-items:flex-start;gap:clamp(4px,2.5vw,28px)}.scale button{width:72px;border:0;background:none;cursor:pointer}.scale button b{margin:auto;width:52px;height:52px;border:1px solid #17231d55;border-radius:50%;display:grid;place-items:center;background:#ffffff66}.scale button:first-child b,.scale button:last-child b{width:65px;height:65px}.scale button:hover b,.scale button.sel b{background:var(--lime);box-shadow:4px 4px 0 var(--ink)}.scale button span{display:block;font-size:9px;opacity:.5;margin-top:12px}.navrow{display:flex;justify-content:space-between;align-items:center}.dots{font-size:11px;letter-spacing:5px;opacity:.35}.result{padding:45px 0}.resultTop{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;border-bottom:1px solid #17231d25;padding-bottom:40px}.type small{color:var(--accent);font-weight:700;letter-spacing:.16em}.type strong{display:block;font:clamp(76px,11vw,132px)/.95 Georgia;letter-spacing:-.05em}.type h1{font:500 34px Georgia,"Songti SC",serif;margin:8px 0}.type p{opacity:.6}.badge{width:220px;height:220px;margin:auto;border:1px solid var(--ink);border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font:28px Georgia;box-shadow:14px 14px 0 var(--lime);transform:rotate(4deg)}.resultGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:60px;padding:45px 0}.sectionTitle{font:500 22px Georgia,"Songti SC",serif;margin-bottom:28px}.axis{margin-bottom:22px}.axisLabel,.percent{display:flex;justify-content:space-between;font-size:12px}.axisTrack{height:8px;background:linear-gradient(90deg,var(--accent),#17231d20);border-radius:8px;position:relative;margin-top:10px}.axisTrack i{position:absolute;top:50%;width:17px;height:17px;border-radius:50%;background:var(--ink);border:4px solid var(--paper);transform:translate(-50%,-50%)}.percent{font:10px Georgia;opacity:.5;margin-top:5px}.insight{border-left:1px solid #17231d22;padding-left:42px}.insight blockquote{font:25px/1.5 Georgia,"Songti SC",serif;margin:0 0 18px}.insight p{font-size:13px;line-height:1.8;opacity:.6}.actions{display:flex;gap:12px;margin-top:28px}.secondary{border:1px solid var(--ink);background:none;border-radius:999px;padding:14px 18px;font-weight:700;cursor:pointer}.disclaimer{text-align:center;font-size:10px;opacity:.4}@keyframes fade{from{opacity:0}to{opacity:1}}

</style></head><body><main class="shell"><header class="nav"><button class="brand" onclick="show('intro')">心镜 <small>PRISM</small></button><span class="note">认识自己，不定义自己</span></header>
<section id="intro" class="screen hero active"><div class="eyebrow">24 个生活切片 · 约 4 分钟</div><h1>你看世界的方式，<br><em>藏在每一次选择里。</em></h1><p class="lede">一份轻量的人格倾向测试，从能量、信息、判断与节奏四个维度，拼出属于你的性格光谱。</p><button class="primary" onclick="start()">开始探索　→</button><p class="fine">不是诊断，也没有标准答案。请按“真实的你”作答。</p><div class="orb"></div><div class="dims"><span><b>01</b>能量来源</span><span><b>02</b>信息偏好</span><span><b>03</b>决策方式</span><span><b>04</b>生活节奏</span></div></section>
<section id="quiz" class="screen quiz"><div class="top"><button class="leave" onclick="show('intro')">← 暂时离开</button><div class="prog"><i id="bar"></i></div><span id="count" class="count"></span></div><div class="qbox"><small>凭第一感觉回答</small><h2 id="question"></h2><div id="scale" class="scale"></div></div><div class="navrow"><button id="back" class="back" onclick="prev()">← 上一题</button><span id="dots" class="dots"></span></div></section>
<section id="result" class="screen result"><div id="resultTop" class="resultTop"><div class="type"><small>你的心镜人格</small><strong id="code"></strong><h1 id="name"></h1><p id="tag"></p></div><div id="badge" class="badge"></div></div><div class="resultGrid"><div><h2 class="sectionTitle">01　你的性格光谱</h2><div id="axes"></div></div><aside class="insight"><h2 class="sectionTitle">02　给你的提醒</h2><blockquote>“人格不是一个盒子，而是一张此刻的地图。”</blockquote><p>你的结果反映的是倾向，不是能力上限。情境、经验和成长都会让光谱移动。</p><div class="actions"><button class="primary" onclick="copyResult()">复制结果</button><button class="secondary" onclick="restart()">重新测试</button></div></aside></div><p class="disclaimer">本测试仅用于娱乐与自我探索，不构成心理评估、医疗建议或专业诊断。</p></section></main>
<script>
const Q=[['参加一场陌生人的聚会后，我通常比出发前更有精神。','EI',1],['比起想象未来的可能，我更信任已经发生的事实。','SN',1],['做重要决定时，我会先考虑它对人的感受有何影响。','FT',1],['一个清晰的日程表会让我感到安心，而不是受限。','JP',1],['连续社交几小时后，我需要独处才能恢复。','EI',-1],['我经常从零散线索中联想到还未发生的可能。','SN',-1],['即使真相令人不舒服，我也倾向于直说问题本身。','FT',-1],['旅行时，我喜欢保留足够空间临时改变计划。','JP',-1],['遇到新环境，我往往会主动开启第一段对话。','EI',1],['学习新事物时，具体示例比抽象理论更容易吸引我。','SN',1],['发生争执时，我更在意关系是否被修复。','FT',1],['我喜欢先完成任务，再放心享受空闲。','JP',1],['我的想法通常要在心里成形后，才愿意说出来。','EI',-1],['我容易被隐喻、象征和“如果……会怎样”打动。','SN',-1],['评价一个方案时，一致的原则比特殊处境更重要。','FT',-1],['截止日期临近时，我反而更容易进入最佳状态。','JP',-1],['我乐于把刚冒出的想法边说边整理。','EI',1],['我会留意环境中具体、微小、可验证的变化。','SN',1],['朋友向我倾诉时，我会先回应感受，再分析办法。','FT',1],['开始一天之前，我希望知道大致会发生什么。','JP',1],['比起认识很多人，我更珍惜少数深入的关系。','EI',-1],['重复成熟的方法，会让我错过发现新路径的机会。','SN',-1],['只要逻辑成立，我能暂时把个人好恶放在一边。','FT',-1],['我常同时推进几件事，再按当下状态切换。','JP',-1]];
const TYPES={INTJ:['远境建筑师','把复杂世界重构成一张可行的蓝图。','#6d5dfc'],INTP:['概念潜航者','沿着问题下潜，直到看见结构本身。','#6d5dfc'],ENTJ:['航线指挥官','看见目标，也看见抵达目标的路径。','#ff6b4a'],ENTP:['可能性点火者','用一个新问题，撬动一整套旧答案。','#ff6b4a'],INFJ:['静默引路人','读懂未说出口的部分，并温柔地指向远方。','#2ca58d'],INFP:['内心造梦家','用真诚守住价值，也为世界保留诗意。','#2ca58d'],ENFJ:['共鸣召集者','让不同的人看见彼此，也看见共同方向。','#f0a43c'],ENFP:['灵感漫游者','追随好奇心，把热情传递给身边的人。','#f0a43c'],ISTJ:['秩序守望者','用可靠与细致，让承诺稳稳落地。','#4267d5'],ISFJ:['温柔照料者','记得每个细节，也珍惜每份托付。','#4267d5'],ESTJ:['现实推进者','把混乱整理成步骤，把决定变成进展。','#de5d83'],ESFJ:['关系织网者','让每个人被看见，让团体更有温度。','#de5d83'],ISTP:['冷静解题者','在真实世界里观察、拆解、精准行动。','#348aa7'],ISFP:['感官诗人','忠于当下的感受，以自己的方式表达美。','#348aa7'],ESTP:['现场破局者','越接近真实现场，越能找到漂亮解法。','#e07b39'],ESFP:['气氛发光体','把生命力带进每个此刻，也照亮身边的人。','#e07b39']};
const AX={EI:['向外连接','向内聚焦','E','I'],SN:['现实实感','抽象远见','S','N'],FT:['关系共情','原则析理','F','T'],JP:['规划定序','弹性探索','J','P']};let idx=0,ans=Array(24).fill(0),last='';try{let s=JSON.parse(localStorage.prism||'null');if(s&&s.ans){ans=s.ans;idx=s.idx||0}}catch(e){}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}function start(){let i=ans.findIndex(x=>!x);idx=i<0?0:i;show('quiz');render()}function render(){question.textContent=Q[idx][0];count.textContent=String(idx+1).padStart(2,'0')+' / 24';bar.style.width=(ans.filter(Boolean).length/24*100)+'%';back.disabled=idx===0;dots.textContent='•'.repeat(idx)+'●'+'•'.repeat(23-idx);scale.innerHTML=['非常不同意','不同意','有点不同意','不确定','有点同意','同意','非常同意'].map((x,i)=>`<button class="${ans[idx]===i+1?'sel':''}" onclick="choose(${i+1})"><b>${i+1}</b><span>${x}</span></button>`).join('')}function choose(v){ans[idx]=v;localStorage.prism=JSON.stringify({ans,idx});setTimeout(()=>{if(idx===23)finish();else{idx++;render()}},130)}function prev(){if(idx>0){idx--;render()}}function score(){let t={EI:0,SN:0,FT:0,JP:0};Q.forEach((q,i)=>t[q[1]]+=((ans[i]||4)-4)*q[2]);let c=Object.keys(t).map(a=>t[a]>=0?AX[a][2]:AX[a][3]).join('');return[t,c]}function finish(){let [t,c]=score(),p=TYPES[c];last=`我的心镜人格是 ${c}「${p[0]}」——${p[1]}`;result.style.setProperty('--accent',p[2]);code.textContent=badge.textContent=c;name.textContent=p[0];tag.textContent=p[1];axes.innerHTML=Object.keys(t).map(a=>{let v=Math.round(50+t[a]/18*50),pos=Math.max(4,Math.min(96,100-v));return`<div class="axis"><div class="axisLabel"><b>${AX[a][0]}</b><b>${AX[a][1]}</b></div><div class="axisTrack"><i style="left:${pos}%"></i></div><div class="percent"><span>${v}%</span><span>${100-v}%</span></div></div>`}).join('');show('result')}function copyResult(){navigator.clipboard.writeText(last).then(()=>alert('结果已复制'))}function restart(){ans=Array(24).fill(0);idx=0;localStorage.removeItem('prism');show('intro')}
</script></body></html>
